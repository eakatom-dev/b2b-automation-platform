<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        Top Bar
    </header>

    <div class="app-layout">
        <aside class="sidebar">
        Sidebar
        </aside>

        <main class="main-content">
            <section class="hero">
                <div class="cover">Cover</div>

                <div class="hero-info">
                    <p>Podcast</p>
                    <h1>Podcast Title</h1>
                    <p>Podcast description</p>
                </div>
            </section>
            <div class="content-grid">
                <section class="episodes">
                    <h2>All Episodes</h2>
                    <article class="episode">
                        <div class="episode-cover">EP</div>

                        <div class="episode-info">
                            <h3>Episode 1</h3>
                            <p>คำอธิบายสั้น ๆ ของตอนนี้</p>
                        </div>

                        <button class="play-button">▶</button>
                    </article>
                    <article class="episode">
                        <div class="episode-cover">EP</div>

                        <div class="episode-info">
                            <h3>Episode 2</h3>
                            <p>คำอธิบายสั้น ๆ ของตอนที่สอง</p>
                        </div>

                        <button class="play-button">▶</button>
                    </article>
                </section>

                <section class="about">
                    <h2>About</h2>
                    <p>รายละเอียดของ Podcast</p>
                </section>
            </div>
        </main>
    </div>

    <footer class="player">
        Now Playing
    </footer>
</body>
</html>
